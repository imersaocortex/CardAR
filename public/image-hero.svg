<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(124,58,237,0.2)"/>
      <stop offset="100%" stop-color="rgba(6,182,212,0.15)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Grid dots -->
  <g fill="#7c3aed" opacity="0.06">
    <pattern id="dots" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1.5"/>
    </pattern>
    <rect width="1200" height="900" fill="url(#dots)"/>
  </g>

  <!-- Glow effects -->
  <ellipse cx="600" cy="450" rx="400" ry="350" fill="rgba(124,58,237,0.08)"/>
  <ellipse cx="300" cy="200" rx="200" ry="200" fill="rgba(6,182,212,0.05)"/>
  <ellipse cx="900" cy="650" rx="250" ry="200" fill="rgba(124,58,237,0.06)"/>

  <!-- Floating shapes -->
  <rect x="80" y="180" width="50" height="50" rx="10" fill="rgba(124,58,237,0.15)" transform="rotate(20, 105, 205)"/>
  <rect x="980" y="280" width="40" height="40" rx="8" fill="rgba(6,182,212,0.12)" transform="rotate(-15, 1000, 300)"/>
  <rect x="900" y="680" width="35" height="35" rx="6" fill="rgba(124,58,237,0.1)" transform="rotate(30, 917, 697)"/>

  <!-- Phone body -->
  <rect x="420" y="200" width="170" height="340" rx="28" fill="url(#card)" stroke="rgba(124,58,237,0.3)" stroke-width="2"/>
  <!-- Screen -->
  <rect x="435" y="218" width="140" height="300" rx="16" fill="#0a0a1a"/>
  <!-- Camera -->
  <rect x="480" y="208" width="24" height="5" rx="2.5" fill="#1a1a2e"/>
  <!-- Status bar -->
  <rect x="435" y="218" width="140" height="35" rx="16" fill="rgba(124,58,237,0.08)"/>
  <!-- AR content - concentric circles -->
  <circle cx="505" cy="340" r="55" fill="none" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
  <circle cx="505" cy="340" r="35" fill="none" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <circle cx="505" cy="340" r="18" fill="rgba(124,58,237,0.15)"/>
  <!-- 3D shape inside -->
  <polygon points="505,312 525,335 505,358 485,335" fill="rgba(6,182,212,0.3)" stroke="rgba(6,182,212,0.5)" stroke-width="1"/>
  <polygon points="505,325 518,340 505,355 492,340" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="0.5"/>
  <!-- Bottom controls -->
  <circle cx="485" cy="490" r="3" fill="#7c3aed" opacity="0.6"/>
  <circle cx="505" cy="490" r="3" fill="#06b6d4" opacity="0.6"/>
  <circle cx="525" cy="490" r="3" fill="#7c3aed" opacity="0.4"/>
  <!-- Home indicator -->
  <rect x="478" y="512" width="50" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- Floating badge: AR Experience -->
  <g transform="translate(620, 260)">
    <rect x="0" y="0" width="110" height="32" rx="8" fill="rgba(18,18,30,0.85)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#7c3aed"/>
    <text x="26" y="20" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" font-weight="500">AR Experience</text>
  </g>

  <!-- Floating badge: Ao Vivo -->
  <g transform="translate(620, 440)">
    <rect x="0" y="0" width="80" height="28" rx="8" fill="rgba(18,18,30,0.85)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
    <circle cx="14" cy="14" r="3" fill="#22c55e"/>
    <text x="22" y="18" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)" font-weight="500">Ao Vivo</text>
  </g>

  <!-- Floating card: stats -->
  <g transform="translate(370, 500)">
    <rect x="0" y="0" width="130" height="36" rx="10" fill="rgba(18,18,30,0.85)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
    <circle cx="18" cy="18" r="8" fill="url(#phone)"/>
    <circle cx="34" cy="18" r="8" fill="#7c3aed"/>
    <circle cx="50" cy="18" r="8" fill="#06b6d4"/>
    <text x="64" y="22" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">
      <tspan font-weight="bold" fill="rgba(255,255,255,0.95)">+500</tspan> empresas
    </text>
  </g>

  <!-- Connection lines -->
  <line x1="590" y1="276" x2="620" y2="276" stroke="rgba(124,58,237,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="590" y1="454" x2="620" y2="454" stroke="rgba(6,182,212,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="420" y1="518" x2="370" y2="518" stroke="rgba(124,58,237,0.2)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Right side data bars -->
  <g opacity="0.12">
    <rect x="780" y="300" width="160" height="6" rx="3" fill="#7c3aed"/>
    <rect x="800" y="320" width="120" height="6" rx="3" fill="#06b6d4"/>
    <rect x="790" y="340" width="140" height="6" rx="3" fill="#7c3aed"/>
    <rect x="810" y="360" width="100" height="6" rx="3" fill="#06b6d4"/>
    <rect x="790" y="380" width="130" height="6" rx="3" fill="#7c3aed"/>
  </g>

  <!-- Bottom fade -->
  <rect x="0" y="780" width="1200" height="120" fill="url(#bg)"/>
</svg>
